<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style.css">
    <title>Aula com CSS</title>

</head>


<body>

    <h1>Cadastro de alunos</h1>
    <h2>Alunos cadastrados</h2>
    <table border="1" ceLLspacing="0">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Curso</th>
                <th>Idade</th>
                <th>Cidade</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Arthur</td>
                <td>Desenvolvedor de sistemas</td>
                <td>15</td>
                <td>Novo Hamburgo</td>
            </tr>
            <tr>
                <td>Otho</td>
                <td>Excel</td>
                <td>25</td>
                <td>Campo Bom</td>
            </tr>
            <tr>
                <td>Murilo</td>
                <td>Informática</td>
                <td>22</td>
                <td>São Leopoldo</td>
            </tr>
            <tr>
                <td>Lucas </td>
                <td>Desenvolvedor de sistemas</td>
                <td>25</td>
                <td>Estãncia Velha</td>
            </tr>
        </tbody>
    </table>
    <br><br><br>
    <h2>Novo Cadastro</h2>
    <form action="#" method="post">

        <label for="nome">Nome Completo:</label>
        <br>
        <input type="text" id="nome" placeholder="Digite seu nome">
        <br><br>

        <label for="email">Email:</label>
        <br>
        <input type="email" id="email" placeholder="Digite seu email">
        <br><br>

        <label for="idade">Idade:</label>
        <br>
        <input type="text" id="idade" placeholder="Digite sua idade">
        <br><br>

        <label for="curso">Escolha seu curso:</label>
        <br>
        <select name="curso" id="curso">
            <option value="">Selecione um curso</option>
            <option value="informatica">Informática</option>
            <option value="excel">Excel</option>
            <option value="desenvolvimento">Desenvolvimento de sistemas</option>
        </select>
        <br><br>
        <label for="mensagem">Observações:</label>
        <br>
        <textarea id="mensagem" rows="4" placeholder="Digite alguma observação"></textarea>
        <br><br>

        <button type="submit">Cadastrar

        </button>


    </form>



</body>
</html>
