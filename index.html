<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 2</title>
    <style>


        body{
            background-color: azure;
            text-align: center;
            justify-content: center;
            justify-items: center;
        }
        
    </style>

</head>


<body>
    
        
    <h1>Login</h1>

    <form action="#" method="post">
        <label for="nome"> Nome:</label>
        <input type="text" id="nome" placeholder="Seu nome.." required>
        <br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="seuemail@gmail.com" required>
        <br><br>
        <label for="senha">Senha:</label>
        <input type="password" id="senha" required>
        <br><br>
        <label for="mensagem">Mensagem:</label> 
        <textarea name="mensagem" id="mensagem" rows="1" cols="30" placeholder="Escreva aqui.."></textarea>
        <br><br>
        <label for="cidade">Cidade:</label>
        <select name="cidade" id="cidade">
            <option value="">Selecione..</option>
            <option value="nh">Novo Hamburgo</option>
            <option value="sl">São Leopoldo</option>
            <option value="cb">Campo Bom</option>
            <option value="mgo">Montenegro</option>
        </select>

    </form>








</body>
</html>
