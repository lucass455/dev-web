<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula com CSS</title>

    <style>
        h1{
            color: black;
        }

        body{
            text-align: center;
        }

        .texto{
            color: yellowgreen;
        }

        .cor1{
            color: blue;
        }

        .cor2{
            color: black;
        }

        .cor3{
            color: brown;
        }

        .cores{

            border-radius: 10px;
            margin-left: 30%;
            margin-right: 30%;
        }
    </style>
    </style>

    
    </style>

</head>


<body>

    <h1>Título</h1>

    <h2 class="texto">Meu nome é lucas</h2>

    <div class="cores">

        <p class="cor1">azul</p>
        <p class="cor2">preto</p>
        <p class="cor3">marrom</p>

    </div>
    

</body>
</html>
